# How the Jarvis web app runs on a server (jarvis-dev or jarvis-prod).
# The deploy workflow copies this file, the Caddyfile, the certificate, and
# a root-only .env (the Claude Code token) to /home/deploy/jarvis/, sets
# IMAGE_TAG, APP_ENV, and SITE_ADDRESS, then runs
# `docker compose pull && docker compose up -d`.
#
# Ports 80 and 443 on the server are only reachable over Tailscale: the
# Lightsail firewall has no TCP ports open to the internet.

services:
  web:
    image: ghcr.io/eliadablah/jarvis-web:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: jarvis-web
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      # Jarvis works inside my vault (read-only).
      JARVIS_WORKDIR: /home/node/vault
    # CLAUDE_CODE_OAUTH_TOKEN lives only in this file on the server.
    env_file: .env
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Claude Code's conversation history, kept across restarts.
      - claude_home:/home/node
      # My vault, kept fresh by vault-sync. Jarvis can read it, never change it.
      - vault:/home/node/vault:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Pulls my private vault repo every 5 minutes into the shared vault volume.
  vault-sync:
    image: alpine/git:v2.52.0
    container_name: jarvis-vault-sync
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/run/vault/vault-sync.sh"]
    environment:
      HOME: /tmp
      SYNC_INTERVAL: "300"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - vault:/vault
      - ./vault-sync.sh:/run/vault/vault-sync.sh:ro
      - ./vault_key:/run/vault/key:ro
      - ./github_known_hosts:/run/vault/known_hosts:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The key file belongs to the deploy user with mode 600; this one
    # capability lets the container's root read it.
    cap_add:
      - DAC_OVERRIDE

  # HTTPS in front of the app.
  proxy:
    image: caddy:2.11.7-alpine
    container_name: jarvis-proxy
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  claude_home:
  vault:
  caddy_data:
  caddy_config:
