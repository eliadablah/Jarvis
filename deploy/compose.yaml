# How the Jarvis web app runs on a server (jarvis-dev or jarvis-prod).
# The deploy workflow copies this file, the Caddyfile, and the certificate
# to /home/deploy/jarvis/, sets IMAGE_TAG, APP_ENV, and SITE_ADDRESS, then
# runs `docker compose pull && docker compose up -d`.
#
# Ports 80 and 443 on the server are only reachable over Tailscale: the
# Lightsail firewall has no TCP ports open to the internet.

services:
  web:
    image: ghcr.io/eliadablah/jarvis-web:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: jarvis-web
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
    expose:
      - "3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # HTTPS in front of the app.
  proxy:
    image: caddy:2.11.7-alpine
    container_name: jarvis-proxy
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
