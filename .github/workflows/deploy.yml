# CD: builds the web app image and deploys it.
#   push to dev  -> jarvis-dev  (automatic)
#   push to main -> jarvis-prod (waits for my approval in the "production" environment)
#
# The runner reaches the servers only through Tailscale, joining as tag:ci,
# which the tailnet policy limits to SSH as the "deploy" user.

name: Deploy

on:
  push:
    branches: [dev, main]
    paths:
      - "app/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eliadablah/jarvis-web

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag = short commit SHA
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile runs the tests during the build, so a failing test
      # stops the image from ever being pushed.
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Both deploy jobs: join Tailscale, sign in to AWS with a short-lived OIDC
  # token (DNS + certificates only), point the name at the server, make sure
  # the certificate is valid, then ship and restart.

  deploy-dev:
    name: Deploy to jarvis-dev
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev-jarvis.eliadablah.com
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      HOST: jarvis-dev
      APP_ENV: dev
      DOMAIN: dev-jarvis.eliadablah.com
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale as the CI robot
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sign in to AWS (DNS and certificates only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DNS_ROLE_ARN }}
          aws-region: us-east-1

      - name: DNS and certificate
        env:
          CERT_BUCKET: ${{ vars.CERT_BUCKET }}
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}
        run: bash deploy/dns-and-cert.sh "$HOST" "$DOMAIN"

      - name: Deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VAULT_DEPLOY_KEY: ${{ secrets.VAULT_DEPLOY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash deploy/deploy.sh "$HOST" "$APP_ENV" "${{ needs.build.outputs.tag }}" "$DOMAIN"

  deploy-prod:
    name: Deploy to jarvis-prod
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jarvis.eliadablah.com
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      HOST: jarvis-prod
      APP_ENV: prod
      DOMAIN: jarvis.eliadablah.com
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale as the CI robot
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sign in to AWS (DNS and certificates only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DNS_ROLE_ARN }}
          aws-region: us-east-1

      - name: DNS and certificate
        env:
          CERT_BUCKET: ${{ vars.CERT_BUCKET }}
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}
        run: bash deploy/dns-and-cert.sh "$HOST" "$DOMAIN"

      - name: Deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VAULT_DEPLOY_KEY: ${{ secrets.VAULT_DEPLOY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash deploy/deploy.sh "$HOST" "$APP_ENV" "${{ needs.build.outputs.tag }}" "$DOMAIN"
